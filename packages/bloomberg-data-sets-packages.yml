    name: blpapi_cpp
    url: https://blpapi.bloomberg.com/download/releases/raw/files/blpapi_cpp_3.26.7.1-linux.tar.gz
    install: download and unpack the platform tarball/zip from the API Library page
    official: true
    version: 3.26.7.1
    published: null
    note: >-
      Version read from the pinned filename in the published download URL. Windows zip
      and macOS ARM (experimental) builds carry the same 3.26.7.1 pin. No registry
      metadata endpoint exists for this distribution.
  - language: java
    registry: cdn
    name: blpapi_java
    url: https://blpapi.bloomberg.com/download/releases/raw/files/blpapi_java_3.26.7.1.zip
    install: download and unpack the platform zip/tarball from the API Library page
    official: true
    version: 3.26.7.1
    published: null
    note: >-
      Version read from the pinned filename. The macOS ARM Java build lags at 3.26.6.1
      and is labelled experimental. Not published to Maven Central - a solrsearch query
      for blpapi returns no Bloomberg-owned coordinates.
  - language: csharp
    registry: cdn
    name: blpapi_dotnet
    url: https://blpapi.bloomberg.com/download/releases/raw/files/blpapi_dotnet_3.26.7.1.zip
    install: download and unpack the Windows zip from the API Library page
    official: true
    version: 3.26.7.1
    published: null
    note: Version read from the pinned filename in the published download URL.
  - language: csharp
    registry: nuget-private
    name: Bloomberg.Blpapi
    url: https://nuget.blpapi.bloomberg.com/releases/v3/index.json
    install: >-
      dotnet nuget add source --name bloomberg-blpapi-release --username token --password
      download --store-password-in-clear-text
      https://token:download@nuget.blpapi.bloomberg.com/releases/v3/index.json &&
      dotnet add package Bloomberg.Blpapi --prerelease
    official: true
    version: null
    published: null
    note: >-
      The C# FFI API, distributed from Bloomberg's own NuGet v3 feed rather than
      nuget.org (api.nuget.org returns 404 for bloomberglp.blpapi and an
      azuresearch-usnc query for blpapi returns nothing). The feed requires the
      token/download credential pair Bloomberg publishes on the API Library page, so the
      version was not read - `null` here means checked and not readable anonymously, not
      absent. Bloomberg labels the release experimental and the documented install uses
      --prerelease.
  - language: python
    registry: cdn
    name: schemadownloader
    url: https://blpapi.bloomberg.com/download/releases/raw/files/schemadownloader_1.2-linux.tar.gz
    install: download and unpack the platform archive from the API Library page
    official: true
    version: '1.2'
    published: null
    note: >-
      First-party command-line utility for downloading BLPAPI service schemas. Version
      read from the pinned filename. See cli/bloomberg-data-sets-cli.yml.
  - language: javascript
    registry: npm
    name: blpapi
    url: https://www.npmjs.com/package/blpapi
    install: npm install blpapi
    official: true
    version: 1.2.0
    published: '2015-03-19'
    note: >-
      Bloomberg Open API binding for Node.js, MIT-licensed, repository
      github.com/bloomberg/blpapi-node. First-party (the npm repository field points at
      the Bloomberg GitHub org) but ABANDONED: the last publish is 2015-03-19, the
      backing repository was last pushed 2017-10-05 and is now archived, and the SDK it
      wraps has since advanced from 3.8-era to 3.26.7.1. It still draws 356 downloads a
      month. Decay evidence, not a supported client.
