method: searched
source: >-
  https://professional.bloomberg.com/support/api-library/ (the published download
  table), https://blpapi.bloomberg.com/repository/releases/python/simple/blpapi/
  (Bloomberg's own PEP 503 index), https://bloomberg.github.io/blpapi-docs/, and the
  npm registry metadata for the blpapi package.
description: >-
  Bloomberg ships the BLPAPI SDK as first-party client libraries in C++, Java, C#/.NET
  and Python. None of them are published to the mainstream public registries: there is
  no blpapi on PyPI, no blpapi on RubyGems, no Bloomberglp.Blpapi on nuget.org and no
  blpapi artifact on Maven Central. Bloomberg operates its own PEP 503 Python index and
  its own NuGet v3 feed, and distributes the C++/Java/.NET builds as versioned zip and
  tarball downloads. The one package that IS on a public registry - npm blpapi - is a
  2015 release from an archived repository.
registry_note: >-
  All version numbers below were read from a machine-readable source: the Bloomberg PEP
  503 index for the Python wheel, the pinned filenames in the published download URLs
  for the C++/Java/.NET/schemadownloader artifacts, and registry.npmjs.org for the npm
  package. Bloomberg's index publishes no upload dates, so `published:` is null with a
  note for those entries rather than guessed.
packages:
  - language: python
    registry: bloomberg-pep503
    name: blpapi
    url: https://blpapi.bloomberg.com/repository/releases/python/simple/blpapi/
    install: python -m pip install --index-url=https://blpapi.bloomberg.com/repository/releases/python/simple/ blpapi
    official: true
    version: 3.26.7.1
    published: null
    note: >-
      Latest wheel on Bloomberg's own PEP 503 index (540 wheel files, 27 SDK versions
      from 3.25.x through 3.26.7.x). The index emits no upload dates, so `published` is
      null - checked, nothing to record. Wheels are provided for Windows (32/64-bit),
      macOS ARM and most Linux distributions. NOT on PyPI: pypi.org/pypi/blpapi/json
      returns 404.
  - language: cpp
