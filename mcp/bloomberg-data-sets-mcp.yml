description: >-
  Bloomberg publishes NO Model Context Protocol server, hosted or installable. Every MCP
  server that exposes Bloomberg data is a third-party project that wraps the licensed
  BLPAPI SDK against a Terminal the operator already pays for. None is authored,
  endorsed, or distributed by Bloomberg L.P., and none is recorded as a Bloomberg agent
  surface. No MCPServer pointer is emitted in apis.yml, because emitting one would
  credit Bloomberg with an agent surface it does not ship.
