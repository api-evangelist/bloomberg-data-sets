description: >-
  Bloomberg publishes NO plans, tiers, quotas or prices for its data products. Access to
  Data License, B-PIPE, Server API and the Bloomberg Terminal is contract-negotiated
  through sales; the product pages carry a "Request a Demo" call to action and regional
  sales telephone numbers instead of a pricing table, and the API Library page carries
  no commercial terms at all. This file records that absence deliberately.
  SUPERSEDES a 2026-05-04 bulk-sweep scaffold that asserted Free / Professional /
  Enterprise tiers with 1,000 and 100,000 request monthly quotas. Bloomberg publishes no
  such tiers and never did - those numbers were generated defaults, not harvested values,
  and have been removed rather than left to be read as Bloomberg's pricing.
plan_count: 0
plans: []
access_model:
  pricing: contract
  self_service_signup: false
  published_price_page: false
  onboarding: sales-led
  evidence:
    - url: https://professional.bloomberg.com/products/data/data-management/data-license
      status: 200
      finding: >-
        No prices, plans, tiers or limits. Calls to action are "Request a Demo" and
        regional sales numbers (Americas +1 212 318 2000, EMEA +44 20 7330 7500, Asia
        Pacific +65 6212 1000). Documented access methods are REST API, SFTP and native
        cloud delivery; getting started is "data.bloomberg.com or DATA <GO> on the
        Bloomberg Terminal".
    - url: https://professional.bloomberg.com/support/api-library/
      status: 200
      finding: >-
        SDK downloads and install commands only; no commercial terms. The page does note
        that the Linux and macOS ARM libraries "cannot be used by Bloomberg Professional
        terminal users (which use the Desktop API). They are only compatible with the
        Bloomberg Server API and B-Pipe data feed products."
