- aid: bloomberg-data-sets:bloomberg-data-license
  name: Bloomberg Data License
  description: Bloomberg Data License provides bulk and per-security delivery of Bloomberg's reference, pricing,
    regulatory and alternative data for quantitative analysis, research and enterprise data management. Delivery
    is available over a hypermedia-driven REST API (the Hypermedia API, HAPI) at api.bloomberg.com/eap, over SFTP,
    and natively in the major cloud providers. The REST surface requires a JWT; an unauthenticated request returns
    HTTP 401 unauthorized_client.
  humanURL: https://professional.bloomberg.com/products/data/data-management/data-license
  baseURL: https://api.bloomberg.com/eap
