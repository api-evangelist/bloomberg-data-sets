apis:
- aid: bloomberg-data-sets:bloomberg-data-api
  name: Bloomberg Data API
  description: 'The Bloomberg Open API (BLPAPI) provides programmatic access to Bloomberg''s market data, reference
    data, historical data and intraday tick data. It is an event-driven session protocol rather than an HTTP API:
    clients open a session, request a service such as //blp/refdata or //blp/mktdata, and consume events and messages.
    First-party SDKs are published for C++, Java, C# (.NET) and Python and cover the Desktop API, Server API and
    B-PIPE products.'
  humanURL: https://professional.bloomberg.com/support/api-library/
  tags:
  - Financial Data
  - Historical Data
  - Market Data
  - Real-Time
  - Reference Data
  properties:
  - type: Documentation
