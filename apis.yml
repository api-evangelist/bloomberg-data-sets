aid: bloomberg-data-sets
name: Bloomberg Data Sets
description: Bloomberg L.P. delivers financial market data, reference data, pricing, regulatory and alternative
  data to financial professionals through two machine-facing surfaces. The Bloomberg Open API (BLPAPI) is a native
  session protocol with first-party SDKs in C++, Java, C# (.NET) and Python, covering real-time market data, reference
  data, historical data and intraday tick data across the Desktop API, Server API and B-PIPE products. Bloomberg
  Data License adds bulk and per-security delivery of the same content catalogue over a JWT-authenticated hypermedia
  REST API at api.bloomberg.com/eap, over SFTP, and natively in the major cloud providers. Bloomberg publishes no
  OpenAPI, AsyncAPI, GraphQL schema or MCP server; its API reference for the REST surface sits behind the Bloomberg
  Enterprise Console, while the BLPAPI SDK reference, downloads and version archive are fully public.
