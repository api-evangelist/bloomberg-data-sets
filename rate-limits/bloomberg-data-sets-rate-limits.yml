specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Bloomberg Data Sets
providerId: bloomberg-data-sets
created: '2026-05-04'
modified: '2026-08-27'
method: searched
source: >-
  https://professional.bloomberg.com/support/api-library/,
  https://professional.bloomberg.com/products/data/data-management/data-license, and
  live response-header inspection of https://api.bloomberg.com/eap/ on 2026-08-27.
tags:
  - Analytics
  - Data Sets
  - Financial Services
  - Market Data
  - Rate Limiting
  - Quotas
description: >-
  Bloomberg publishes NO rate limits for any of its data APIs, and its API responses
  carry no rate-limit signalling. Consumption is governed by contractual data
  entitlements and per-security or per-dataset licensing rather than by request-rate
  quotas an agent can read at runtime.
  SUPERSEDES a 2026-05-04 bulk-sweep scaffold that asserted 10 / 100 / 1,000
  requests-per-minute tiers and X-RateLimit-* response headers. None of that was
  harvested from Bloomberg and none of it is served by Bloomberg; it has been removed
  rather than left to be read as published limits.
limit_count: 0
limits: []
headers: {}
headers_note: >-
  No RateLimit-*, X-RateLimit-* or Retry-After header appeared on any observed
  api.bloomberg.com response. The headers actually returned are X-Request-ID,
  X-Content-Type-Options, X-Frame-Options, Content-Security-Policy and, on /eap/*,
  Access-Control-Allow-Origin / Access-Control-Allow-Methods.
responseCodes:
  throttled: null
  observed:
    - status: 401
      meaning: unauthorized_client - no JWT presented
    - status: 403
      meaning: access_denied - path outside the anonymous surface
  note: No 429 was observed and none is documented.
evidence:
  - url: https://api.bloomberg.com/eap/catalogs/
    status: 401
    finding: No rate-limit headers present on the response.
  - url: https://professional.bloomberg.com/support/api-library/
    status: 200
    finding: No published limits, quotas or throttling policy.
  - url: https://professional.bloomberg.com/products/data/data-management/data-license
    status: 200
    finding: No published limits, quotas or throttling policy.
maintainers:
